version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: equity_research_db
    environment:
      POSTGRES_USER: equity_user
      POSTGRES_PASSWORD: equity_pass
      POSTGRES_DB: equity_research
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data: